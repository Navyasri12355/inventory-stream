apiVersion: 1

datasources:
  - name: TimescaleDB
    type: postgres
    uid: timescaledb_main
    # TSDB_HOST / TSDB_PORT differ between native and docker mode.
    # docker-compose.yml sets TSDB_HOST=timescaledb, TSDB_PORT=5432.
    # Native: TSDB_HOST=localhost, TSDB_PORT=DB_PORT (from .env).
    url: ${TSDB_HOST}:${TSDB_PORT}
    database: ${DB_NAME}
    user: ${DB_USER}
    secureJsonData:
      password: ${DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600   # PostgreSQL 16
      timescaledb: true
    isDefault: true
    editable: false
